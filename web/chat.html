<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group chat — RideSync</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div id="sidebar-root"></div>
  <div class="app-wrap">
    <div class="main">
      <header id="topbar-root"></header>
      <main class="content" style="padding-top:18px">
        <div class="chat-layout">
          <aside class="chat-members">
            <h4>Members</h4>
            <div id="chatMemberList"></div>
          </aside>
          <div class="chat-main">
            <div class="chat-head">
              <div class="avatar lg" id="chatAvatar" style="background:var(--grad-accent)"><i class="fa-solid fa-users" style="font-size:1rem"></i></div>
              <div>
                <h3 id="chatGroupName">Group chat</h3>
                <span id="chatOnlineInfo">—</span>
              </div>
            </div>
            <div class="chat-log" id="chatLog"></div>
            <form class="chat-input" id="chatForm">
              <textarea id="chatInput" rows="1" placeholder="Message your crew… (Enter to send)"></textarea>
              <button type="submit" class="btn btn-primary btn-icon" style="width:46px;height:46px;border-radius:14px"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/firebase.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/chat.js"></script>
</body>
</html>
